# Сводка воронки новичков (только суммы счётчиков) — для анализа
name: Funnel report
on:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --omit=dev --ignore-scripts >/dev/null 2>&1 || npm i firebase-admin >/dev/null
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/funnel.js
