<body>

<h1>Блог Northfall: гайды и советы</h1>
<p class="sub">Билды, классы, PvP-арена, кланы и экипировка в браузерной RPG о варварах Севера.</p>
<div id="soro-blog"></div>
<script src="https://app.trysoro.com/api/embed/1e107d1b-f061-4a55-8a39-cb026df65d82" defer></script>
<script>
// просмотры статей: считаем открытие статьи в виджете и показываем число под заголовком
(function(){var box=document.getElementById('soro-blog');if(!box)return;
var cur='',n=null,tm=0,base='/blog';
function head(){return box.querySelector('h1')||box.querySelector('h2')||box.querySelector('h3')}
function isArt(){var p=location.pathname.replace(/\/+$/,'');return p!==base||!!location.search||!!location.hash||!!box.querySelector('h1')}
function word(x){var m=x%10,c=x%100;return c>10&&c<15?'просмотров':m===1?'просмотр':m>1&&m<5?'просмотра':'просмотров'}
function show(){var h=head();if(!h||n===null)return;var e=box.querySelector('.nbv');if(!e){e=document.createElement('div');e.className='nbv';h.insertAdjacentElement('afterend',e)}
 var t='👁 '+n+' '+word(n);if(e.textContent!==t)e.textContent=t}
function seen(k){try{return localStorage.getItem('nbv:'+k)===new Date().toISOString().slice(0,10)}catch(e){return false}}
function mark(k){try{localStorage.setItem('nbv:'+k,new Date().toISOString().slice(0,10))}catch(e){}}
function run(){tm=0;var h=head();if(!h||!isArt()){cur='';n=null;return}
 var k=h.textContent.replace(/\s+/g,' ').trim().slice(0,160);if(!k)return;
 if(k===cur){show();return}
 cur=k;n=null;var post=!seen(k);
 var q=post?fetch('/api/bv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k:k})}):fetch('/api/bv?k='+encodeURIComponent(k));
 q.then(function(r){return r.ok?r.json():null}).then(function(d){if(!d||cur!==k)return;if(post)mark(k);n=d.n;show()}).catch(function(){})}
function kick(){if(!tm)tm=setTimeout(run,250)}
new MutationObserver(kick).observe(box,{childList:true,subtree:true});
window.addEventListener('popstate',kick);window.addEventListener('hashchange',kick);kick()})();
</script>
