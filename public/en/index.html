 else if(k==='brew')op={k:'cstart',r:'brew',n:+v,p:CRV};

 if(r.err){CRMSG=r.err==='stale'?'':r.err;return render()}

let SNC=null,SNF=[],SNL=0;
function snowPause(){if(SNC){SNC.remove();SNC=null}SNF=[];}
function snowRun(){
 let rm=false;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
 if(!snowOn()||rm){if(SNC){SNC.remove();SNC=null}return}
 if(SNC)return;SNC=document.createElement('canvas');SNC.id='snow';SNC.setAttribute('aria-hidden','true');document.body.prepend(SNC);
 const cx=SNC.getContext('2d');let W=0,H=0;
 const fl=()=>{const r=.5+Math.random()*1.3,a=Math.random()*6.283,sp=2+Math.random()*6;return{x:Math.random()*W,y:Math.random()*H,r,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,p:Math.random()*6.283,w:.3+Math.random()*.9,a:.4+Math.random()*.5,t:Math.random()*6.283}};
 const fit=()=>{const d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;SNC.width=W*d;SNC.height=H*d;cx.setTransform(d,0,0,d,0,0);
  const n=Math.round(Math.min(80,Math.max(28,W*H/15000)));while(SNF.length<n)SNF.push(fl());SNF.length=n};
 fit();addEventListener('resize',fit);
 const tick=t=>{if(!SNC||fight)return;requestAnimationFrame(tick);if(document.hidden)return;if(t-SNL<33)return;const dt=Math.min(.1,(t-SNL)/1000);SNL=t;
  let lt=false;try{const m=getComputedStyle(document.body).backgroundColor.match(/\d+/g);lt=m&&(+m[0]+ +m[1]+ +m[2])>450}catch(e){}
  cx.clearRect(0,0,W,H);
  for(const f of SNF){f.p+=f.w*dt;f.t+=dt*(.6+f.w);f.x+=(f.vx+Math.sin(f.p)*4)*dt;f.y+=(f.vy+Math.cos(f.p*.7)*3)*dt;
   if(f.x<-5)f.x=W+5;else if(f.x>W+5)f.x=-5;if(f.y<-5)f.y=H+5;else if(f.y>H+5)f.y=-5;
   const al=f.a*(.55+.45*Math.sin(f.t));
   const g=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*3);const c=lt?'120,96,60':'240,214,160';
   g.addColorStop(0,`rgba(${c},${al})`);g.addColorStop(.35,`rgba(${c},${al*.6})`);g.addColorStop(1,`rgba(${c},0)`);
   cx.fillStyle=g;cx.beginPath();cx.arc(f.x,f.y,f.r*3,0,6.283);cx.fill()}};
 requestAnimationFrame(t=>{SNL=t;tick(t)})}

// ===== Ответы сервера по мировому циклу: босс, охота, территории, войны, клан =====
// Сервер сам считает урон по боссу, доли в награде, очки на территории,
// итоги войн и расход казны. Клиент только показывает, что пришло.
function cycState(m){
 const t=m.t;
 if(t==='wbs'){
  if(m.st==='ok'&&m.kill){WREP=WREP||{};WREP.kill=true;const n=wbName(DAY());news(`${S.name} landed the final blow — ${n} has fallen!`);log(`${n} is defeated! Collect your reward.`,'hit')}
  if(!fight)render();return}
 if(t==='wbc'){
  if(m.st==='ok')wbPrize(m);
  else if(m.st==='done'){log('The reward for this boss has already been claimed.','sys');render()}
  return}
 if(t==='hunts'){
  if(m.st==='ok'){const dd=m.dmg|0;if(dd>0)S.cxt=(S.cxt|0)+Math.floor(dd/CXK);if(m.dq)log(`Daily quest complete: +${m.dq.g} silver and +${m.dq.i} iron to the clan treasury.`,'hit');if(!fight)render()}
  else if(m.st==='rate'){log('Too fast — part of the loot was not counted.','sys')}
  return}
 if(t==='wars'){
  if(m.st==='ok'){log(`War declared on the clan “${cname(m.b)}”. It will last 24 hours.`,'sys');clog(`${S.name} declared war on the clan “${cname(m.b)}».`,'🔥')}
  else if(m.st==='busy')log('This clan is already at war.','sys');
  else if(m.st==='notlead')log('Only the clan leader can declare war.','sys');
  else log('Could not declare war.','sys');
  render();return}
 if(t==='warc'){
  if(m.st==='ok'){const w=m.win?'War won: ':(m.draw?'War draw: ':'War lost: ');log(w+(m.g|0)+' silver'+(m.rt?' and '+(m.rt|0)+' rating':'')+'.','sys');S.wclaim=S.wclaim||[];if(!S.wclaim.includes(m.id))S.wclaim.push(m.id)}
  else if(m.st==='early')log('The war hasn\'t ended yet.','sys');
  else if(m.st==='done')log('The reward for this war has already been claimed.','sys');
  render();return}
 if(t==='clans'){
  if(m.st==='ok'){
   if(m.k==='quest'){log(`Weekly quest complete: +${m.g} silver and +${m.i} iron to the clan treasury.`,'hit');clog(`Weekly quest complete: to the treasury ${m.g} silver.`,'🏆')}
   else if(m.k==='dungeon')log(`Dungeon share: +${m.i} iron to the clan treasury.`,'sys');
   else if(m.k==='cqtake'){const D=CQD[m.b];log(`Quest “${D?D.n:''}” taken. You have 24 hours to finish it.`,'hit');const my=CLN.find(c=>c.id===S.clan);if(my&&D)clog(`${S.name} took the quest “${D.n}».`,'📋')}
   else if(m.k==='cqdrop')log('You gave up the quest.','sys');
   else if(m.k==='cqreset')log('Clan quest board cleared.','sys');
   else if(m.k==='build'){const nm=(BLD[m.b]||[''])[0];log(`Built: ${nm}, lv. ${m.lv}.`,'sys');clog(`${S.name} upgraded the building “${nm}” to ${m.lv}.`,'🏛')}
  } else if(m.st==='busy')log('This quest is already taken or resting.','sys');
  else if(m.st==='limit')log('You can hold no more than two quests.','sys');
  else if(m.st==='ban')log('You can\'t take this quest yet: you missed it last time.','sys');
  else if(m.st==='nomoney')log('Not enough funds in the treasury.','sys');
  else if(m.st==='lvl')log(`This building needs clan level ${m.need|0}.`,'sys');
  else if(m.st==='notlead')log('Only the clan leader can do this.','sys');
  else if(m.st==='done')log('This has already been claimed.','sys');
  else log('Couldn\'t do it.','sys');
  render();return}
 if(t==='wbe'||t==='hunte'||t==='ware'||t==='clane'){log('The server rejected the request.','sys');render();return}
}
// ===== Проверка версии: игра сама предлагает обновиться, когда вышел новый ре =====
// Особенно важно для установленного приложения (иконка на главном экране): там своя
// копия service worker и старый кэш картинок, и без подсказки игрок сидит на старой версии.
const vnum=v=>String(v||'').split('.').map(x=>parseInt(x,10)||0);
function vNewer(a,b){const x=vnum(a),y=vnum(b);for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i]}return false}
let VCKV='';
function verChk(){
  try{fetch('/version.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(j&&j.v&&vNewer(j.v,GVER)&&j.v!==VCKV){VCKV=j.v;updShow()}
  }).catch(()=>{})}catch(e){}
}
// перезагрузка с обратной связью: кнопка сразу отвечает, сохранение уходит, устаревшая копия страницы
// из кэша выбрасывается (иначе после обновления можно снова получить старую версию), адрес с меткой обходит кэш
function nfReload(){
  const m=document.getElementById('updm'),b=m&&m.querySelector('button');if(b){b.disabled=true;b.textContent='Refreshing…'}
  let gone=false;const go=()=>{if(gone)return;gone=true;try{const u=new URL(location.href);u.searchParams.set('_r',Date.now().toString(36));location.replace(u.toString())}catch(e){location.reload()}};
  setTimeout(go,2500);
  try{saveNow()}catch(e){}
  try{HUB.dead=true;if(HUB.ws)HUB.ws.close()}catch(e){}
  try{(window.caches?caches.keys().then(ks=>Promise.all(ks.map(k=>caches.open(k).then(c=>Promise.all([c.delete('/'),c.delete('/en/'),c.delete('/index.html')]))))):Promise.resolve()).catch(()=>{}).then(()=>setTimeout(go,300))}catch(e){go()}
}
try{if(/[?&]_r=/.test(location.search))history.replaceState(null,'',location.pathname+location.search.replace(/([?&])_r=[^&]*&?/,'$1').replace(/[?&]$/,'')+location.hash)}catch(e){}
function updShow(){
  if(document.getElementById('updm'))return;
  if(typeof fight!=='undefined'&&fight){setTimeout(updShow,4000);return} // не мешаем бою
  const d=document.createElement('div');d.className='modal';d.id='updm';d.style.zIndex=210;
  d.innerHTML=`<div class="mbox" style="text-align:center"><h3 style="margin:0 0 8px">An update is ready</h3><p style="margin:0 0 12px">A new version of the game is out. Reload to get the fresh graphics and all the fixes.</p><button class="b red" style="width:100%" onclick="nfReload()">Update the game</button></div>`;
  document.body.appendChild(d);
}
setTimeout(verChk,1200);setInterval(verChk,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verChk()});
window.addEventListener('focus',verChk);window.addEventListener('online',verChk);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.ready.then(r=>r.update()).catch(()=>{}));

 L.sort(K[CF.sort]||K.rat);

// ===== Доска заданий клана: общие задания, одно на игрока, 24 часа на выполнение и 24 часа отката =====
// Правила и награды считает сервер (server/cq.js); здесь только показ и кнопки. Числа должны совпадать с сервером.
const CQD={
 hunt:{n:'Hunt the beasts',d:'Kill {t} monsters on the hunt',t:L=>120+20*L,x:400,g:150,i:0,mg:300,mi:0},
 smash:{n:'Wrecker',d:'Deal {t} damage on the hunt',t:L=>40000*L,x:500,g:200,i:0,mg:350,mi:0},
 raid:{n:'Raid warrior',d:'Win {t} raid',t:()=>1,x:800,g:0,i:8,mg:600,mi:0},
 arena:{n:'Clan arena',d:'Win {t} arena fights',t:()=>3,x:500,g:150,i:0,mg:400,mi:0},
 dun:{n:'Dungeon conqueror',d:'Clear the clan dungeon {t} times',t:()=>2,x:600,g:0,i:10,mg:300,mi:5},
 boss:{n:'Boss hunter',d:'Deal {t} damage to the world boss',t:()=>20000,x:600,g:200,i:0,mg:500,mi:0},
 gift:{n:'Open hand',d:'Put {t} silver into the treasury',t:()=>1000,x:300,g:0,i:0,mg:100,mi:0},
 craft:{n:'Master Craftsman',d:'Finish {t} crafts',t:()=>2,x:400,g:150,i:0,mg:300,mi:0},
 pet:{n:'Faithful friend',d:'Kill {t} monsters with an active pet',t:()=>80,x:300,g:0,i:0,mg:250,mi:0}};
const CQDAY=864e5,cqF=L=>.5+.5*L,
 cqSt=(q,now)=>!q?'free':q.done?(now<(+q.cd||0)?'done':'free'):(q.u&&now<(+q.t||0)+CQDAY?'on':'free'),
 cqHm=ms=>{ms=Math.max(0,ms);const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h?h+' h '+m+' min':m+' min'},
 cqRw=(k,L)=>{const D=CQD[k],f=cqF(L),r=x=>Math.round(x*f);return{x:r(D.x),g:r(D.g),i:r(D.i),mg:r(D.mg),mi:r(D.mi)}};
function cqBoard(my){
 const now=Date.now(),L=cLv(my).L,cq=my.cq||{},act=Object.keys(CQD).filter(k=>cqSt(cq[k],now)==='on'&&cq[k].u===UID).length;
 return`<div class="panel"><h3>Clan quest board</h3><p style="margin:0 0 6px;font-size:15px;color:var(--mute)">Take a quest yourself: you have 24 hours to finish it, one quest, one doer. After completion it returns to the board in 24 hours. You can hold no more than 2 quests. Taken: ${act}/2.</p>
 ${(ADM?`<button class="b alt" data-cqr="1" style="margin:0 0 6px">Reset quests (admin)</button>`:'')+Object.keys(CQD).map(k=>{const D=CQD[k],q=cq[k],st=cqSt(q,now),lv=st==='on'?(q.L|0)||1:L,tg=st==='on'?q.tg:D.t(L),r=cqRw(k,lv),mine=st==='on'&&q.u===UID,ban=q&&q.ban&&(+q.ban[UID]||0)>now?+q.ban[UID]:0;
  const rw=`For you: ${r.mg} silver${r.mi?' and '+r.mi+' iron':''} · for the clan: ${r.x} XP${r.g?', '+r.g+' silver':''}${r.i?', '+r.i+' iron':''}`;
  let tail='';
  if(st==='on')tail=`<div class="lbl"><span>${mine?'You are doing it':'Being done by <b>'+esc(q.n||'player')+'</b>'}</span><span>${kf(Math.min(q.p|0,tg))}/${kf(tg)}</span></div>${bar(Math.min(q.p|0,tg),tg,mine?'--gold':'--mute')}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><small style="color:var(--mute)">Time left ${cqHm((+q.t||0)+CQDAY-now)}</small>${mine?`<button class="b alt" data-cqd="${k}" style="margin:0">Give up</button>`:''}</div>`;
  else if(st==='done')tail=`<p style="margin:4px 0 0;font-size:14px;color:var(--moss)">✓ Completed by ${esc(q.n||'player')}. Back on the board in ${cqHm((+q.cd||0)-now)}.</p>`;
  else tail=ban?`<p style="margin:4px 0 0;font-size:14px;color:var(--mute)">You missed it last time. You can take it again in ${cqHm(ban-now)}.</p>`:`<button class="b" data-cqt="${k}" ${act>=2?'disabled':''} style="margin:4px 0 0">${act>=2?'Already holding 2 quests':'Take quest'}</button>`;
  return`<div class="row" style="display:block;border-top:1px solid color-mix(in srgb,var(--line) 50%,transparent);padding:8px 0"><b>${D.n}</b><div style="font-size:15px">${D.d.replace('{t}',kf(tg))}</div><small style="color:var(--mute)">${rw}</small>${tail}</div>`}).join('')}</div>`}

// ===== Форум клана: темы и ответы внутри клана =====
let CFT=[],cftFor=null,cftUn=null,CFTOP=null,CFP=[],cfpFor=null,cfpUn=null,CFLAST=0;
const cfMod=c=>c&&(c.leader===UID||isOff(c,UID));
function cftSub(){
 const ok=DB&&S&&S.clan&&tab==='clan'&&ctab==='forum';
 if(!ok||cftFor!==S.clan){if(cftUn){cftUn();cftUn=null}cftFor=null;CFT=[];if(!ok||cfpFor&&cfpFor.split('/')[0]!==S.clan)CFTOP=null}
 if(!ok){if(cfpUn){cfpUn();cfpUn=null}cfpFor=null;CFP=[];return}
 if(!cftUn){cftFor=S.clan;cftUn=DB.collection('clans').doc(S.clan).collection('ft').orderBy('last','desc').limit(40).onSnapshot(sn=>{CFT=sn.docs.map(d=>({id:d.id,...d.data()}));if(CFTOP&&!CFT.some(x=>x.id===CFTOP)&&CFT.length)CFTOP=null;if(tab==='clan'&&ctab==='forum'&&!fight)ui()},()=>{})}
 const key=CFTOP?S.clan+'/'+CFTOP:null;
 if(cfpFor!==key){if(cfpUn){cfpUn();cfpUn=null}cfpFor=key;CFP=[];
  if(key)cfpUn=DB.collection('clans').doc(S.clan).collection('ft').doc(CFTOP).collection('fp').orderBy('ts','desc').limit(100).onSnapshot(sn=>{CFP=sn.docs.map(d=>({id:d.id,...d.data()})).reverse();if(tab==='clan'&&ctab==='forum'&&!fight)ui()},()=>{})}}
function cforumView(my){
 const t=CFTOP&&CFT.find(x=>x.id===CFTOP),mod=cfMod(my),col=uid=>{const r=(my.leader===uid||isOff(my,uid))?rankOf(my,uid):'';return r?`var(${RKC[r]})`:'inherit'};
 if(CFTOP&&t){
  const can=t.uid===UID||mod;
  return csub('Forum')+`<div class="panel"><button class="b alt" data-cfa="back" style="margin:0 0 8px">← To topics</button><h3 style="margin:0 0 4px">${t.pin?'📌 ':''}${esc(t.title)}</h3><small style="color:var(--mute)">${esc(t.name||'')} · ${ledTime(t.ts)}</small>
  ${can||mod?`<div style="margin-top:8px">${mod?`<button class="b alt" data-cfa="pin">${t.pin?'Unpin':'Pin'}</button>`:''}${can?`<button class="b alt" data-cfa="tdel">Delete topic</button>`:''}</div>`:''}</div>
  <div class="panel">${CFP.length?CFP.map(x=>`<div class="row"><div style="font-size:15px;min-width:0"><b style="color:${col(x.uid)}">${esc(x.name||'Player')}</b> <small style="color:var(--mute)">${ledTime(x.ts)}</small><p style="margin:2px 0;white-space:pre-wrap;word-break:break-word">${esc(x.text)}</p></div>${x.uid===UID||mod?`<button class="lnk" data-cfd="${x.id}" aria-label="Delete">✕</button>`:''}</div>`).join(''):'<p>Loading messages…</p>'}</div>
  <div class="panel"><h3>Reply</h3><textarea id="cfr" maxlength="1000" rows="3" placeholder="Message" aria-label="Message"></textarea><button class="b" data-cfa="reply" style="margin-top:6px">Send</button></div>`}
 const L=[...CFT].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.last|0)-(a.last|0));
 return csub('Forum')+`<div class="panel"><h3>New topic</h3><input id="cft" maxlength="80" placeholder="Title" aria-label="Title"><textarea id="cfb" maxlength="1000" rows="3" placeholder="Text" aria-label="Text"></textarea><button class="b" data-cfa="new" style="margin-top:6px">Create topic</button></div>
 <div class="panel"><h3>Clan forum</h3>${L.length?L.map(x=>`<div class="row" data-cft="${x.id}" style="cursor:pointer"><div style="min-width:0"><b>${x.pin?'📌 ':''}${esc(x.title)}</b><small>${esc(x.name||'')} · replies ${x.n|0}${x.lby?' · last: '+esc(x.lby):''}</small></div><small style="color:var(--mute);white-space:nowrap">${ledTime(x.last||x.ts)}</small></div>`).join(''):'<p>No topics yet. Start the first one: discuss clan plans, wars and the dungeon.</p>'}</div>`}
function cfAct(a,arg){
 const my=CLN.find(c=>c.id===S.clan);if(!my||!DB)return;const cs=DB.collection('clans').doc(my.id).collection('ft'),now=Date.now();
 const slow=()=>{if(now-CFLAST<4000){log('Wait a couple of seconds.','sys');return true}CFLAST=now;return false};
 const val=id=>(document.getElementById(id)||{}).value||'';
 if(a==='open'){CFTOP=arg;cftSub();render();return}
 if(a==='back'){CFTOP=null;cftSub();render();return}
 if(a==='new'){const ti=val('cft').trim().slice(0,80),tx=val('cfb').trim().slice(0,1000);if(!ti||!tx||slow())return;const id='t'+now.toString(36)+Math.random().toString(36).slice(2,5);
  cs.doc(id).set({title:ti,uid:UID,name:S.name,ts:now,last:now,n:0}).then(()=>cs.doc(id).collection('fp').doc('p'+now.toString(36)).set({uid:UID,name:S.name,text:tx,ts:now})).then(()=>{CFTOP=id;cftSub();render()}).catch(()=>{log('Could not create the topic.','sys');render()});return}
 const t=CFT.find(x=>x.id===CFTOP);if(!t)return;
 if(a==='reply'){const tx=val('cfr').trim().slice(0,1000);if(!tx||slow())return;
  cs.doc(t.id).collection('fp').doc('p'+now.toString(36)+Math.random().toString(36).slice(2,4)).set({uid:UID,name:S.name,text:tx,ts:now}).then(()=>cs.doc(t.id).update({last:now,n:(t.n|0)+1,lby:S.name})).then(()=>{const el=document.getElementById('cfr');if(el)el.value=''}).catch(()=>{log('Could not send.','sys');render()});return}
 if(a==='pin'){if(!cfMod(my))return;cs.doc(t.id).update({pin:!t.pin}).catch(()=>{log('Could not pin.','sys')});return}
