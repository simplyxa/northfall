}

let MK=[],mkUn=null,MKMSG='';const MKFEE=.05,mkC=m=>m.au?'au':'gold',mkU=m=>m.au?'зол.':'сер.';
function mkSub(){if(!DB||mkUn)return;mkUn=DB.collection('market').limit(200).onSnapshot(sn=>{MK=sn.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))}));if(tab==='market'&&!fight)ui();else if(MK.some(m=>m.seller===UID&&m.sold))ui()},()=>{})}
function mkList(){const it=MODIT;if(!it||!DB||!S.inv.includes(it)||it.pb)return;const el=document.getElementById('mprice'),pr=Math.max(1,Math.floor(+(el&&el.value)||0));if(!pr)return;
 const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);S.inv=S.inv.filter(x=>x!==it);save();closeModal();
 DB.collection('market').doc(id).set({seller:UID,sname:S.name,item:JSON.parse(JSON.stringify(it)),price:pr,au:true,ts:Date.now(),sold:false}).then(()=>{MKMSG=`«${it.name}» выставлен на рынок за ${pr} зол.`;log(MKMSG,'sys');render()}).catch(()=>{S.inv.push(it);save();log('Не удалось выставить вещь на рынок.','sys');render()});render()}
function mkBuy(id){const m=MK.find(x=>x.id===id);if(!m||m.seller===UID||m.sold||(S[mkC(m)]|0)<m.price)return;if(S.inv.length>=INV_MAX){log('Рюкзак полон.','sys');return render()}
 const ref=DB.collection('market').doc(id);ref.get().then(sn=>{if(!sn.exists||sn.data().sold){MKMSG='Эту вещь уже купили.';return render()}
  return ref.update({sold:true,buyer:UID,bname:S.name}).then(()=>{if((S[mkC(m)]|0)<m.price){ref.update({sold:false,buyer:null}).catch(()=>{});return}S[mkC(m)]-=m.price;const it=fixItem(JSON.parse(JSON.stringify(m.item)));it.uid=uid();S.inv.push(it);MKMSG=`Куплено: «${it.name}» за ${m.price} ${mkU(m)}`;log(MKMSG,'sys');save();render()})}).catch(()=>{MKMSG='Покупка не удалась.';render()})}
function mkCancel(id){const m=MK.find(x=>x.id===id);if(!m||m.seller!==UID||m.sold)return;if(S.inv.length>=INV_MAX){log('Рюкзак полон, освободи место.','sys');return render()}
 const ref=DB.collection('market').doc(id);ref.get().then(sn=>{if(!sn.exists)return;if(sn.data().sold){MKMSG='Вещь уже купили, забери выручку.';return render()}return ref.delete().then(()=>{const it=fixItem(JSON.parse(JSON.stringify(m.item)));it.uid=uid();S.inv.push(it);MKMSG=`«${it.name}» снят с продажи и вернулся в рюкзак.`;save();render()})}).catch(()=>{})}
function mkCollect(id){const m=MK.find(x=>x.id===id);if(!m||m.seller!==UID||!m.sold)return;const g=Math.floor(m.price*(1-MKFEE));DB.collection('market').doc(id).delete().then(()=>{S[mkC(m)]=(S[mkC(m)]|0)+g;MKMSG=`Продано «${m.item.name}» игроку ${m.bname||''}: +${g} ${mkU(m)} (сбор рынка ${Math.round(MKFEE*100)}%).`;log(MKMSG,'sys');save();render()}).catch(()=>{})}
function marketView(){if(!DB)return'<div class="panel"><p>Рынок работает только с подключённой базой данных.</p></div>';
 const mine=MK.filter(m=>m.seller===UID),act=MK.filter(m=>!m.sold&&m.seller!==UID).sort((a,b)=>b.ts-a.ts);

 if(mine.length)h+=`<div class="panel"><h3>Мои лоты</h3>${mine.map(m=>irow(m.item,m.sold?`<button class="b" data-mc="${m.id}">Забрать ${Math.floor(m.price*(1-MKFEE))} ${mkU(m)}</button>`:`<span class="${m.au?'g':'sv'}" style="font-weight:700">${m.price} ${mkU(m)}</span><button class="b alt" data-mx="${m.id}">Снять</button>`,m.sold?` · <span style="color:var(--moss)">продано: ${esc(m.bname||'')}</span>`:'')).join('')}</div>`;

const terTag=k=>{const o=terOwner(k);return o?`<br>Владеет «${esc(o.name)}»${S.clan===o.id?' · <b style="color:var(--moss)">твой клан: +'+Math.round(TERB*100)+'%</b>':''}`:''};
const isOff=(c,id)=>(c.off||[]).includes(id),canMng=c=>c&&(c.leader===UID||isOff(c,UID)),rankOf=(c,id)=>c.leader===id?'Лидер':isOff(c,id)?'Офицер':'Участник';
function cUpd(c,o){return DB.collection('clans').doc(c.id).update(o).catch(()=>{log('Не удалось изменить клан.','sys');render()})}
function setOff(id){const c=CLN.find(x=>x.id===S.clan);if(!c||c.leader!==UID||id===UID)return;const o=c.off||[],was=o.includes(id);cUpd(c,{off:was?o.filter(x=>x!==id):[...o,id]}).then(()=>clog(was?`${pnm(id)} больше не офицер.`:`${pnm(id)} назначен офицером.`,'🎖'))}
function togClosed(){const c=CLN.find(x=>x.id===S.clan);if(!canMng(c))return;cUpd(c,{closed:!c.closed})}
function applyClan(cid){const c=CLN.find(x=>x.id===cid);if(!c)return;if((c.req||[]).some(r=>r.id===UID))return;cUpd(c,{req:[...(c.req||[]).filter(r=>r.id!==UID),{id:UID,name:S.name,lvl:S.lvl}].slice(-30)}).then(()=>{log(`Заявка в клан «${c.name}» отправлена.`,'sys');render()})}
function reqDo(id,ok){const c=CLN.find(x=>x.id===S.clan);if(!canMng(c))return;const o={req:(c.req||[]).filter(r=>r.id!==id)};if(ok){if(mem(c).length>=cCap(c)){log('В клане нет мест.','sys');return render()}o.acc=[...(c.acc||[]).filter(x=>x!==id),id]}cUpd(c,o)}
function accCheck(){if(!S||S.clan||!DB)return;const c=CLN.find(x=>(x.acc||[]).includes(UID));if(!c)return;S.cxt=0;S.cxq=0;S.clan=c.id;cUpd(c,{acc:(c.acc||[]).filter(x=>x!==UID)});log(`Тебя приняли в клан «${c.name}».`,'hit');clog(`${S.name} принят в клан.`,'➕',c.id);save()}
const WQT=c=>20000*cLv(c).L,WQR=c=>1500*cLv(c).L;
function wqClaim(){const c=CLN.find(x=>x.id===S.clan);if(!canMng(c))return;const w=c.wq||{};if(w.wk!==curS()||(w.xp|0)<WQT(c)||w.done)return;const g=WQR(c);
 cUpd(c,{wq:{...w,done:true}}).then(()=>{const ref=DB.collection('clans').doc(c.id).collection('dep').doc('quest');return ref.get().then(sn=>{const o=sn.exists?sn.data():{};return ref.set({name:'Задания клана',gold:(o.gold|0)+g,iron:(o.iron|0)+Math.round(g/20)})})}).then(()=>{log(`Задание недели выполнено: +${g} серебра и +${Math.round(g/20)} железа в казну клана.`,'hit');clog(`Задание недели выполнено: в казну ${g} серебра.`,'🏆');render()})}
let TER={},terUn=null;const TERN={easy:'Опушка',mid:'Глухой лес',hard:'Чаща'},TERB=.15;
function terSub(){if(!DB||terUn)return;terUn=DB.collection('terr').limit(10).onSnapshot(sn=>{TER={};sn.docs.forEach(d=>{TER[d.id]=JSON.parse(JSON.stringify(d.data()))});if(['hunt','clan'].includes(tab)&&!fight)ui()},()=>{})}
const terOwner=k=>{const t=TER[k];if(!t)return null;if(t.wk===curS())return t.owner?{id:t.owner,name:t.oname}:null;const e=Object.entries(t.pts||{}).sort((a,b)=>b[1]-a[1])[0];return e?{id:e[0],name:(t.names||{})[e[0]]||cname(e[0])}:null};
function terFlush(){if(!S||fight||!DB||!S.clan||!S.tq)return;const q=S.tq;S.tq=null;save();const cid=S.clan,cn=cname(cid);
 for(const k in q){const n=q[k];if(!(n>0))continue;const ref=DB.collection('terr').doc(k);ref.get().then(sn=>{let t=sn.exists?JSON.parse(JSON.stringify(sn.data())):{wk:curS(),pts:{},names:{}};
  if(t.wk!==curS()){const e=Object.entries(t.pts||{}).sort((a,b)=>b[1]-a[1])[0];t={wk:curS(),pts:{},names:{},owner:e?e[0]:null,oname:e?(t.names||{})[e[0]]||'':''}}
  t.pts=t.pts||{};t.names=t.names||{};t.pts[cid]=(t.pts[cid]|0)+n;t.names[cid]=cn;return ref.set(t)}).catch(()=>{})}}
function terView(){return`<div class="panel"><h3>Территории Севера</h3><p style="margin:0 0 6px;color:var(--mute);font-size:15px">Каждый убитый на охоте зверь приносит твоему клану очко в этой местности. Клан с наибольшим числом очков за неделю владеет территорией всю следующую неделю: его воины получают +${Math.round(TERB*100)}% опыта и серебра на охоте там.</p>`+
 Object.keys(TERN).map(k=>{const t=TER[k],o=terOwner(k),pts=t&&t.wk===curS()?Object.entries(t.pts||{}).sort((a,b)=>b[1]-a[1]).slice(0,3):[];return`<div class="row"><div><b>${TERN[k]}</b><small>Владеет: ${o?`<b style="color:var(--gold)">«${esc(o.name)}»</b>`:'никто'}${pts.length?' · эта неделя: '+pts.map(([id,v])=>`${esc((t.names||{})[id]||cname(id))} ${v}`).join(', '):''}</small></div></div>`}).join('')+`</div>`}

const SAGA=[
 ['Глаз за мудрость','У корней Иггдрасиля бьёт источник Мимира, и кто изопьёт из него, узнает всё, что было и будет. Один пришёл к источнику, но Мимир потребовал платы. Всеотец не торговался.','Что отдал Один за глоток из источника Мимира?',['свой глаз','копьё Гунгнир','коня Слейпнира']],
 ['Молот грома','Локи поспорил на свою голову, что гномы-кузнецы не скуют ничего лучше уже сделанных даров. Братья Брокк и Эйтри раздули горн, и из огня вышел молот с короткой рукоятью, которым Тор с тех пор крушит великанов.','Кто выковал Мьёльнир?',['гномы-кузнецы','валькирии','великан Имир']],
 ['Конь Всеотца','Быстрее ветра мчится конь Одина, по земле, по морю и по воздуху. Он один из немногих, кто может пройти даже в царство Хель и вернуться.','Сколько ног у Слейпнира?',['восемь','шесть','четыре']],
 ['Рука в пасти волка','Боги трижды пытались сковать Фенрира. Лишь цепь Глейпнир, сплетённая гномами из шума кошачьих шагов и корней гор, удержала волка. Но Фенрир согласился надеть её, только если один из асов вложит руку ему в пасть.','Кто из богов лишился руки, сковывая Фенрира?',['Тюр','Тор','Бальдр']],
 ['Мировое древо','Ясень Иггдрасиль держит на ветвях и корнях все миры: от сияющего Асгарда до мглистого Нифльхейма. Белка Рататоск бегает по стволу и разносит бранные слова между орлом на вершине и змеем у корней.','Сколько миров держит Иггдрасиль?',['девять','семь','двенадцать']],
 ['Два ворона','Каждое утро два ворона облетают весь мир, а к вечеру садятся Одину на плечи и шепчут ему обо всём, что видели. Всеотец боится лишь одного: что однажды они не вернутся.','Что означают имена воронов Хугин и Мунин?',['Мысль и Память','День и Ночь','Война и Мир']],
 ['Выбирающие павших','Над полем битвы летят девы в шлемах. Они выбирают храбрейших из павших и уносят их туда, где воины пируют вечером и сражаются утром, готовясь к последней битве.','Куда валькирии уносят павших героев?',['в Вальхаллу','в Хельхейм','в Муспельхейм']],
 ['Светлый бог','Мать Бальдра взяла клятву со всего на свете не вредить её сыну, и боги шутя метали в него оружие. Только одно растение показалось ей слишком юным для клятвы, и Локи вложил его в руку слепого Хёда.','Чем был сражён Бальдр?',['веткой омелы','ледяным копьём','стрелой из ясеня']],
 ['Сумерки богов','Придёт время, когда разорвутся все цепи. Волк вырвется на свободу, разинет пасть от земли до неба, и сам Всеотец падёт в последней битве.','Кто поглотит Одина в Рагнарёк?',['волк Фенрир','змей Ёрмунганд','великан Сурт']],
 ['Змей в океане','В глубинах моря лежит змей такой длины, что опоясывает весь Мидгард и держит во рту свой хвост. Однажды Тор почти вытащил его на крючок с бычьей головой.','С кем сойдётся Тор в последней битве?',['со змеем Ёрмунгандом','с волком Фенриром','с огненным Суртом']],
 ['Страж радуги','Радужный мост Биврёст ведёт из мира людей в Асгард. Его страж спит меньше птицы, видит на сто вёрст ночью и слышит, как растёт трава. В Рагнарёк он затрубит в рог Гьяллархорн.','Кто стережёт мост Биврёст?',['Хеймдалль','Тюр','Видар']],
 ['Кольцо Одина','Гномы сковали для Одина золотое кольцо, что множит богатство. Его положили на погребальный костёр Бальдра, и Хермод вернул его из царства Хель.','Сколько колец роняет Драупнир каждую девятую ночь?',['восемь','три','девять']],
 ['Колесница богини','Фрейя, владычица любви и сейда, носит ожерелье Брисингамен и собирает половину павших в свой чертог Фолькванг. А ездит она в колеснице, запряжённой необычными зверями.','Кто тянет колесницу Фрейи?',['кошки','волки','олени']],
 ['Гром в небесах','Когда по небу катится гром, это Тор едет в своей колеснице. Его звери не простые: вечером их можно зажарить и съесть, а утром Тор оживляет их молотом, если кости остались целы.','Кто тянет колесницу Тора?',['два козла','два ворона','два медведя']],
 ['Тайна рун','Один пронзил себя копьём и висел на ветру, на древе, корни которого никому не ведомы, без еды и питья. В конце он посмотрел вниз, поднял руны и с криком упал.','Сколько ночей висел Один на древе ради рун?',['девять','три','семь']],
 ['Срединная земля','Боги сделали из ресниц первого великана ограду для мира людей, чтобы защитить его от великанов. Этот мир лежит посредине, между Асгардом наверху и Хельхеймом внизу.','Как зовётся мир людей?',['Мидгард','Асгард','Ванахейм']],
 ['Грызущий корни','Глубоко внизу, у корня, что тянется в Нифльхейм, живёт тёмный дракон. Он грызёт корень Мирового древа и терзает тела клятвопреступников.','Кто грызёт корни Иггдрасиля?',['дракон Нидхёгг','белка Рататоск','ворон Хугин']],
 ['Огненный великан','На юге лежит пылающий Муспельхейм, и стоит на его границе великан с огненным мечом. В Рагнарёк он пройдёт по Биврёсту, и мост рухнет под ним.','Кто придёт с огненным мечом из Муспельхейма?',['Сурт','Имир','Тьяцци']],
 ['Начало всего','В начале времён между льдом и огнём была лишь бездна Гинунгагап. Из тающего инея родился первый великан, а сыновья Бора убили его и сотворили из него мир: из крови — моря, из костей — горы.','Из чьего тела боги сотворили мир?',['из тела Имира','из тела Одина','из тела Бури']],
 ['Хитрец в реке','После смерти Бальдра Локи бежал и спрятался в горах. Днём он принимал облик рыбы и прятался в водопаде, но боги сплели сеть по его же примеру и поймали его.','В кого превратился Локи, прячась от богов?',['в лосося','в ворона','в волка']],
 ['Яблоки юности','Боги не стареют лишь потому, что богиня Идунн хранит в ларце особые плоды. Когда великан Тьяцци похитил её, асы стали седеть и дряхлеть, пока Локи не вернул её назад в облике сокола.','Что хранила Идунн?',['молодильные яблоки','мёд поэзии','волшебные руны']]];

async function hashPw(pw,saltB64){
 const enc=new TextEncoder(),salt=saltB64?Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0)):crypto.getRandomValues(new Uint8Array(16));
 const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:150000},key,256);
 return{salt:btoa(String.fromCharCode(...salt)),h:btoa(String.fromCharCode(...new Uint8Array(bits)))}}

GOLD.pay=(n,why,x,ok)=>{if(SG!==true)return GL0.pay(n,why,x,ok);if((S.au|0)<n){log('Не хватает золота.','sys');return render()}if(GBUSY)return;GBUSY=true;
 goldApi({a:'pay',n,why}).then(j=>{S.au=j.au|0;ok()}).catch(e=>{popup('Не получилось',esc(e.message||'Ошибка сервера'),true)}).finally(()=>{GBUSY=false;tbPaint()})};
GOLD.xbuy=(n,ok)=>{if(SG!==true)return GL0.xbuy(n,ok);if(GBUSY)return;GBUSY=true;
 goldApi({a:'xbuy',n}).then(j=>{S.au=j.au|0;ok()}).catch(e=>{popup('Обмен не выполнен',esc(e.message||'Ошибка сервера'),true)}).finally(()=>{GBUSY=false;tbPaint()})};
GOLD.gift=x=>{if(SG!==true)GL0.gift(x)};
GOLD.adminGift=(to,n)=>{if(SG===true)goldApi({a:'gift',to,n}).catch(e=>popup('Золото не отправлено',esc(e.message||'Ошибка сервера'),true))};
const _mkBuy=mkBuy,_mkCollect=mkCollect;
mkBuy=function(id){const m=MK.find(x=>x.id===id);if(!m||!m.au||SG!==true)return _mkBuy(id);if(m.seller===UID||m.sold||(S.au|0)<m.price)return;if(S.inv.length>=INV_MAX){log('Рюкзак полон.','sys');return render()}if(GBUSY)return;GBUSY=true;
 goldApi({a:'market',id,name:S.name}).then(j=>{S.au=j.au|0;const it=fixItem(JSON.parse(JSON.stringify(j.item)));it.uid=uid();S.inv.push(it);MKMSG=`Куплено: «${it.name}» за ${m.price} зол.`;log(MKMSG,'sys');save();render()}).catch(e=>{MKMSG=e.message||'Покупка не удалась.';render()}).finally(()=>{GBUSY=false})};
mkCollect=function(id){const m=MK.find(x=>x.id===id);if(!m||!m.au||!m.paid)return _mkCollect(id);if(m.seller!==UID)return;
 DB.collection('market').doc(id).delete().then(()=>{MKMSG=`Продано «${m.item.name}» игроку ${m.bname||''}: золото уже в кошельке.`;log(MKMSG,'sys');render()}).catch(()=>{})};

</script>
